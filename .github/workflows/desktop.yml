# The desktop installers, built where they must be built: the Windows one on Windows, the Mac
# one on a Mac. Runs on a version tag (v1.2.3), or by hand from the Actions tab with a version
# to release as; either way the installers are attached to a release of that tag, which is made
# if it does not exist yet.
name: Desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release as, without the v (defaults to package.json's)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the server for the desktop
        run: npm run desktop:build
        env:
          FLODA_LICENCE_SERVER: ${{ vars.FLODA_LICENCE_SERVER || 'https://fl-da.vercel.app' }}
      - name: Make the installer
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # No code signing yet. Windows shows a SmartScreen notice; macOS needs right-click → Open.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: floda-${{ matrix.os }}
          path: |
            dist-desktop/*.exe
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.blockmap
            dist-desktop/latest*.yml
          if-no-files-found: error
      - name: Which version this is
        id: version
        shell: bash
        run: |
          v="${{ github.event.inputs.version }}"
          if [ -z "$v" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="$(node -p "require('./package.json').version")"; fi
          fi
          echo "tag=v${v}" >> "$GITHUB_OUTPUT"
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Flöda ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          # The yml files are what an installed copy reads to learn a newer version exists; the
          # blockmaps let Windows download only what changed.
          files: |
            dist-desktop/*.exe
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.blockmap
            dist-desktop/latest*.yml
