# The desktop installers, built where they must be built: the Windows one on Windows, the Mac
# one on a Mac. Runs on a version tag (v1.2.3), or by hand from the Actions tab with a version
# to release as; either way the installers are attached to a release of that tag, which is made
# if it does not exist yet.
#
# With "open" ticked (or a tag ending in -open) it builds the open copy instead: no sign-in, no
# licence, and the FLODA_ANTHROPIC_API_KEY repository secret baked in as the reading key when
# one is set. That goes to a pre-release of its own, v1.2.3-open, with no latest.yml, so an
# ordinary copy's updater never installs it over itself.
name: Desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release as, without the v (defaults to package.json's)"
        required: false
        default: ""
      open:
        description: "Build the open copy: no sign-in, no licence, the reading key baked in"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  OPEN: ${{ (inputs.open == true || endsWith(github.ref, '-open')) && '1' || '' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the server for the desktop
        run: npm run desktop:build
        env:
          FLODA_LICENCE_SERVER: ${{ vars.FLODA_LICENCE_SERVER || 'https://fl-da.vercel.app' }}
          FLODA_OPEN: ${{ env.OPEN }}
          # Only an open build takes the key; the ordinary app reads through its licence.
          FLODA_ANTHROPIC_API_KEY: ${{ env.OPEN == '1' && (secrets.FLODA_ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY) || '' }}
      - name: Make the installer
        run: npx electron-builder ${{ matrix.target }} --publish never ${{ env.OPEN == '1' && '--config electron-builder.open.yml' || '' }}
        env:
          # No code signing yet. Windows shows a SmartScreen notice; macOS needs right-click → Open.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Keep the open copy out of the updater's sight
        if: env.OPEN == '1'
        shell: bash
        run: rm -f dist-desktop/latest*.yml
      - uses: actions/upload-artifact@v4
        with:
          name: floda-${{ matrix.os }}
          path: |
            dist-desktop/*.exe
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.blockmap
            dist-desktop/latest*.yml
          if-no-files-found: error
      - name: Which version this is
        id: version
        shell: bash
        run: |
          v="${{ github.event.inputs.version }}"
          if [ -z "$v" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="$(node -p "require('./package.json').version")"; fi
          fi
          v="${v%-open}"
          if [ "$OPEN" = "1" ]; then
            echo "tag=v${v}-open" >> "$GITHUB_OUTPUT"; echo "name=Flöda v${v} open copy" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${v}" >> "$GITHUB_OUTPUT"; echo "name=Flöda v${v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          # The open copy is a pre-release: the updater and the download page look past those.
          prerelease: ${{ env.OPEN == '1' }}
          target_commitish: ${{ github.sha }}
          # The yml files are what an installed copy reads to learn a newer version exists; the
          # blockmaps let Windows download only what changed.
          files: |
            dist-desktop/*.exe
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.blockmap
            dist-desktop/latest*.yml
