# How the desktop app is packaged. Run `npm run desktop:build` first; `npm run desktop:dist` then
# makes the installer for the platform it runs on. The GitHub workflow in .github/workflows/desktop.yml
# runs both on a Windows and a macOS runner and attaches the installers to a release.
appId: ai.floda.app
# ASCII on disk (Floda.app, Floda.exe): a path with an umlaut tripped codesign on the build
# runner. The name people see — in the Dock, the menu bar, the installer — is still Flöda.
productName: Floda
copyright: Flöda
# No asar: the server's native modules (Prisma's engine, sharp) load from plain files, and there
# is nothing here worth hiding from the person who installed it.
asar: false
# The native modules come prebuilt for Node's ABI and run under Electron-as-Node unchanged.
npmRebuild: false
directories:
  output: dist-desktop
# Ad-hoc signs the Mac app; see desktop/after-pack.cjs.
afterPack: desktop/after-pack.cjs
files:
  - desktop/**
  - package.json
  - "!**/*.map"
extraResources:
  - from: .next/standalone
    to: standalone
    filter:
      - "**/*"
      - "!**/*.map"
  - from: prisma/template.db
    to: template.db
  - from: desktop/floda.json
    to: floda.json
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: "Floda-Setup-${version}.${ext}"
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  shortcutName: Flöda
  uninstallDisplayName: Flöda
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.business
  artifactName: "Floda-${version}-${arch}.${ext}"
  # No Apple Developer identity yet: electron-builder's own signing is off and the app is ad-hoc
  # signed in after-pack.cjs instead, so Gatekeeper says "unidentified developer" (right-click →
  # Open) rather than "damaged". Notarisation needs an Apple Developer account.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  # CFBundleName is left as electron-builder sets it (Floda): Electron finds its helper apps by
  # that name, so it has to match "Floda Helper.app" or the app stops as it starts ("Unable to
  # find helper app"). The name people see is localised to Flöda in desktop/after-pack.cjs.
  extendInfo:
    CFBundleDisplayName: Flöda
linux:
  target:
    - AppImage
  artifactName: "Floda-${version}.${ext}"
